name: Revert demonstrations

env:
  # Demonstrated tests may invoke accepted-RFC validation, which resolves the
  # proposal PR and its server-timestamped review evidence through gh.
  GH_TOKEN: ${{ github.token }}
  # Demonstrated tests may resolve fresh-clone v3 claim projections. The
  # compatibility matrix owns the older CLI floor; the verifier needs the
  # newest measured reader for the evidence format present in this tree.
  KAN_TAG: v0.13.0-beta.1

# Re-derive what every `Demonstrated-by:` trailer on this branch claims.
#
# The trailer says: "I reverted this fix and named test T failed; I restored it
# and T passed." That is a claim about the work, and `docs/CONVENTIONS.md`'s rule
# about evidence applies to it — a statement nothing can contradict is not
# evidence. This job is what can contradict it: it reverts the commit again, in a
# detached worktree, and checks the named tests actually fail.
#
# Without it the trailer is a sentence an author typed, which is the ceremony the
# roadmap warns about. day#116 asked for a demonstrated before/after rather than
# a passing suite; a demonstration nobody re-derives is a passing suite with
# extra words.
#
# COST, stated rather than discovered. Each verification builds the commit's own
# tree in a fresh worktree — deliberately, because sharing the caller's
# CARGO_TARGET_DIR leaked into a test that shells out to cargo and changed the
# answer. A verifier whose environment can change the result reports
# could-not-check as checked. So this is roughly two to three minutes per
# trailer-carrying commit, and it is why the job is separate from `ci.yml`
# rather than blocking every push's fast feedback.

# **`pull_request` only, deliberately.** The first version also ran on pushes to
# `main`, which looks like belt-and-braces and is a check that cannot fail: after
# a merge, `merge-base(origin/main, HEAD)` IS `HEAD`, so the commit range is
# always empty and the job is permanently green for having found nothing. That is
# the defect this whole milestone is named for, in the job that enforces it —
# found by pushing the branch and noticing the run that never appeared.
#
# The pull request is where the gate belongs anyway: it is the last point at
# which a trailer that does not re-derive is still cheap to fix.
on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the range below needs the merge base, and each
          # verification needs the commit's parent to diff against.
          fetch-depth: 0
          # On a pull_request, the default checkout is the MERGE commit, whose
          # message carries no trailer and whose parents are not the branch.
          # Verify what was actually written.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Cache the kan binary used by demonstrated tests
        id: kan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/kan
          key: kan-${{ env.KAN_TAG }}-${{ runner.os }}

      - name: Install kan used by demonstrated tests
        if: steps.kan-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/kan-tools/kan \
            --tag "${KAN_TAG}" --force kan

      - name: Confirm demonstrated tests can resolve kan
        run: |
          kan --version
          test -x "$(command -v kan)"

      - id: range
        name: Find the commits to verify
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main || true
          if ! base="$(git merge-base refs/remotes/origin/main HEAD)"; then
            # Could-not-check, and it must not read as clean. Every other
            # outcome in this milestone's tooling distinguishes the two, and a
            # verification job that passes because it could not find the
            # commits is the exact defect it exists to catch.
            echo "::error::could not compute a merge base with origin/main, so \
            no commit range could be built. This is a could-not-check, not a pass."
            exit 1
          fi
          # `%H %(trailers:key=Demonstrated-by,valueonly)` would fold multi-line
          # trailers; the script parses the message itself, so this only needs to
          # decide WHICH commits to hand it.
          commits=""
          for sha in $(git rev-list "$base..HEAD"); do
            if git log -1 --format=%B "$sha" | grep -q '^Demonstrated-by:'; then
              commits="$commits $sha"
            fi
          done
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ -z "$commits" ]; then
            echo "No commit in $base..HEAD carries a Demonstrated-by trailer."
          else
            echo "Verifying:$commits"
          fi

      - name: Re-derive each demonstration
        run: |
          set -euo pipefail
          commits="${{ steps.range.outputs.commits }}"
          if [ -z "$commits" ]; then
            echo "Nothing to verify." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          failed=""
          for sha in $commits; do
            subject="$(git log -1 --format=%s "$sha")"
            echo "::group::$sha  $subject"
            if cargo run --quiet -p xtask -- evidence revert --verify "$sha"; then
              echo "- \`${sha:0:8}\` re-derived — $subject" >> "$GITHUB_STEP_SUMMARY"
            else
              failed="$failed $sha"
              echo "- **\`${sha:0:8}\` FAILED to re-derive** — $subject" \
                >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::these commits claim a demonstration that does not \
            re-derive:$failed"
            exit 1
          fi
