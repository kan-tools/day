name: CI

on:
  push:
  pull_request:

env:
  # The kan the hermetic suite runs against. Pinned rather than tracking
  # kan's default branch: CI must fail because *day* changed, and an unpinned
  # dependency turns an unrelated kan commit into a red build here.
  #
  # `.github/workflows/kan-compat.yml` is what covers the *other* versions —
  # this pin is the one pairing every push checks.
  KAN_TAG: v0.9.1-beta.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, not just the tip. `every_released_tag_has_a_migration_expectation`
          # asserts the expectation file has a row for every released tag, and a
          # shallow checkout fetches no tags at all — over an empty set that
          # check is vacuously true. It reports could-not-check rather than
          # passing, which turns a silent hole into a red build; this is what
          # keeps it from being red for the wrong reason.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Without this, `tests/kan_conformance.rs` SKIPS — it resolves `kan`
      # through PATH and skips when absent, per CLAUDE.md's rule that no test
      # may require a real kan install. That rule is right, and its
      # consequence was that day's only check against kan's *actual* contract
      # never ran in CI at all. Every other test stubs kan through
      # DAY_KAN_BIN, which validates day against day's own idea of kan's CLI —
      # the blind spot that shipped a documented `kan result` invocation that
      # does not run, through several releases (day#27, kan#78).
      #
      # kan is not published to crates.io, so this installs from the tag.
      - name: Cache the kan binary
        id: kan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/kan
          key: kan-${{ env.KAN_TAG }}-${{ runner.os }}

      - name: Install kan
        if: steps.kan-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/kan-tools/kan \
            --tag "${KAN_TAG}" kan

      - name: Confirm the conformance suite can actually see kan
        run: |
          # A silent skip is the failure mode this whole block exists to end,
          # so assert kan is present rather than trusting the install step's
          # exit code.
          kan --version
          test -x "$(command -v kan)"

      # Same reason the kan install above exists, and the same failure it
      # prevents. `tests/documented_invocations.rs` runs day's documented
      # examples through zsh where it is available and `sh` otherwise — and the
      # defect it exists for, day#83's unquoted glob, PASSES under `sh`. Without
      # zsh here, the one criterion that reproduces day#83 would be a permanent
      # could-not-check, which is a silent skip wearing a different hat.
      - name: Install zsh, so the docs corpus runs in the shell the bug is in
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          zsh -c 'exit 0'

      - run: cargo build --workspace --all-targets
      # `--no-fail-fast` IS LOAD-BEARING, NOT TIDINESS. `cargo test` aborts the
      # whole run at the first failing TARGET, and a bare `cargo test
      # --workspace` therefore reports on a prefix of the suite whose length
      # depends on which target failed and where it sorts alphabetically.
      #
      # Measured on `main` at 9f66fee (day#178): `tests/behaviour_diff.rs`
      # failed, and **7 of 30 targets ran**. The other 23 -- `plugin.rs`,
      # `kan_conformance.rs`, `documented_invocations.rs`, `harness_honesty.rs`
      # and the rest -- never executed, and `main` had been in that state since
      # at least the previous merge. The red tick said "something failed"; it
      # could not say "23 targets produced no result", and nothing but counting
      # `Running` lines in the log would reveal it.
      #
      # That is this repo's own rule -- could-not-check outranks
      # checked-and-clean -- broken at the RUNNER rather than inside a test. A
      # suite that stops early does not report a smaller failure, it reports an
      # unknown one.
      #
      # It does not weaken the gate. Measured by injecting a panic into an
      # early-sorting target: with fail-fast, 4 targets ran; with
      # `--no-fail-fast`, 30 ran; **both exited 101**. The build still fails, it
      # just fails having actually looked.
      - run: cargo test --workspace --no-fail-fast
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

  # WINDOWS IS A MEASUREMENT BEFORE IT IS A GATE, and this job is deliberately
  # narrower than `test` rather than a copy of it with `runs-on` changed.
  #
  # WHY IT EXISTS. `hooks/bootstrap-check.sh` is `#!/bin/sh`, and the claim that
  # on Windows it "likely does nothing, silently" has now been written into three
  # consecutive handoffs and measured zero times. A guess restated is still a
  # guess, and this repo's rule is to measure before asserting -- an expectation
  # table written from reasoning was eight rows and five wrong. So this job's
  # subject is that one script, and the build cells are what make its result
  # trustworthy rather than the point.
  #
  # WHAT IT CANNOT CHECK, named rather than silently omitted, because
  # could-not-check outranks checked-and-clean:
  #
  #   The integration suite does not run here and cannot. Seventeen files under
  #   `tests/` call `std::os::unix::fs::symlink`, including `tests/common/mod.rs`,
  #   which every integration target imports -- so they do not fail on Windows,
  #   they fail to COMPILE. `cargo test --lib` is therefore what runs: the 185
  #   unit tests, which live in `src/` and carry no `std::os::unix` at all.
  #   Making the integration suite portable is a separate piece of work, and
  #   pretending this job covers it by running a command that cannot build would
  #   be the could-not-check-reported-as-clean failure one level up.
  #
  #   `.claude/skills/` is five symlinks (mode 120000). A Windows checkout
  #   without `core.symlinks` turns them into text files holding their target
  #   path, so the local-reachability wiring is a known open question on Windows
  #   -- and it is `every_shipped_command_is_reachable_in_this_repo` that would
  #   answer it, which is in the suite that cannot compile. Stated so the gap is
  #   visible rather than inferred from a green tick.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # day's own code is portable -- `src/` carries no `std::os::unix`, no
      # `cfg(unix)` and no `cfg(target_os)`. This asserts that stays true.
      - name: Build on Windows
        run: cargo build --workspace

      - name: Unit tests (see the note above for what this deliberately excludes)
        run: cargo test --lib

      # THE PACKAGING-CONFORMANCE SUITE RUNS HERE TOO, and it is the one
      # integration target that can. `tests/agent_plugins.rs` deliberately does
      # not `mod common;` — that module calls `std::os::unix::fs::symlink`, and
      # importing it for one `repo_root()` one-liner would have made the
      # conformance suite for a CROSS-HARNESS PORTABILITY milestone the thing
      # excluded from the only cross-platform job. Four lines bought this.
      - name: Agent Plugins conformance suite
        run: cargo test --test agent_plugins

      # THE ACTUAL QUESTION, cell 1: a Windows machine that HAS a POSIX shell.
      #
      # `windows-latest` ships Git for Windows, so `sh` is on PATH here. That
      # makes this cell the with-bash mode, which is NOT the population the
      # worry is about -- and saying so matters, because a green tick from a
      # runner that happens to have bash would otherwise read as "Windows is
      # fine". This asserts what day depends on: the hook exits 0 and says the
      # words `cargo install day` when the binaries are absent. Neither binary is
      # installed in this job, so the missing-binaries path is the one exercised.
      - name: bootstrap-check.sh, with a POSIX shell present
        shell: bash
        run: |
          # `set +e` EXPLICITLY, and it is load-bearing. GitHub Actions runs
          # `shell: bash` as `bash --noprofile --norc -eo pipefail {0}`, so `-e`
          # is ALREADY ON before this script starts and `set -uo pipefail` does
          # not turn it off. An earlier version of this cell said "NOT `set -e`"
          # and set only `-uo`, which left `-e` live: the capture below aborted
          # the step on a non-zero hook and the diagnostic three lines down was
          # unreachable, so the interesting case exited 3 having printed nothing
          # about why. It failed toward red rather than toward a false pass, but
          # it was a comment asserting a mechanism the mechanism contradicted —
          # in the job whose stated subject is that could-not-check outranks
          # checked-and-clean. Measured both ways before this line was written.
          set +e
          set -uo pipefail

          # Invoked the way `hooks/hooks.json` invokes it — directly, via the
          # shebang, mode 100755 — rather than as `sh <script>`. Those are not
          # the same test: `sh <script>` runs under whatever `sh` is on PATH and
          # would pass on a machine where the shipped invocation cannot execute
          # at all, which is precisely the Windows question this job is here to
          # answer.
          out=$(./hooks/bootstrap-check.sh)
          code=$?
          echo "exit=$code"
          echo "$out"

          # 126 AND 127 ARE COULD-NOT-CHECK, NOT A VERDICT ON THE HOOK, and
          # separating them is the point of this cell rather than a refinement of
          # it. The shell returns 126 when a file exists and cannot be executed
          # and 127 when the interpreter is not found — which is exactly what a
          # CRLF shebang produces: the kernel looks for `/bin/sh` followed by a
          # carriage return and reports `bad interpreter`. Folding that into the
          # check below would emit a definite and FALSE finding, blaming the
          # hook's advisory contract for a checkout artifact, in the job whose
          # stated subject is that could-not-check outranks checked-and-clean.
          # `.gitattributes` pins `*.sh` to `eol=lf` so this should not fire; if
          # it does, that pin stopped working and the message must say so rather
          # than sending the reader to the script.
          if [ "$code" = "126" ] || [ "$code" = "127" ]; then
            echo "::error::COULD NOT EXECUTE hooks/bootstrap-check.sh (exit $code) -- the hook never ran, so this cell establishes NOTHING about its behaviour. Almost certainly line endings or the exec bit rather than the script: a CRLF shebang makes the kernel look for /bin/sh followed by a carriage return. Check that .gitattributes still pins *.sh to eol=lf and that the file is mode 100755."
            file hooks/bootstrap-check.sh || true
            head -c 20 hooks/bootstrap-check.sh | od -c | head -2 || true
            exit 1
          fi

          if [ "$code" != "0" ]; then
            echo "::error::the hook RAN and exited $code. It is advisory and must exit 0 unconditionally -- a hook that fails a session because a dependency is missing is the gate telos/affordance-not-enforcement forbids."
            exit 1
          fi

          # A missing interpreter must report could-not-check, never pass. This
          # is the shape `scripts/mutate.py` exists to stop being reinvented
          # badly: an absent tool that silently skips its own assertion is the
          # failure mode this repo keeps recording.
          command -v python >/dev/null 2>&1 || {
            echo "::error::python is not on PATH, so the payload could not be validated. Reporting could-not-check rather than passing."
            exit 1
          }

          printf '%s' "$out" | python -c '
          import json, sys
          d = json.load(sys.stdin)
          assert list(d) == ["systemMessage"], f"a hook may emit only a systemMessage here; got {list(d)}"
          m = d["systemMessage"]
          for want in ("cargo install day", "cargo install kan"):
              assert want in m, f"the notice must name {want!r}; got {m!r}"
          print("OK: exits 0, emits only a systemMessage, names both install commands")
          '

      # THE ACTUAL QUESTION, cell 2: a Windows machine with NO POSIX shell.
      #
      # This is the mode the handoffs worry about and the one a default runner
      # does not represent, so it is invoked the way a shell-less Windows would:
      # straight through cmd.exe, which is the closest reachable stand-in for a
      # harness that does not route hook commands through Git Bash.
      #
      # IT ASSERTS NOTHING ABOUT THE OUTCOME, on purpose. A test asserting "cmd
      # cannot run this" goes red the day someone fixes it, which is a gate
      # pointing the wrong way. What it does is RECORD the outcome in the job
      # summary so the claim stops being a guess -- and it fails only if the
      # measurement itself could not be taken.
      #
      # What this still does not establish is how Claude Code dispatches a hook
      # command on Windows. That is the other side of the interface and belongs
      # in its docs, not in an inference drawn from this cell.
      - name: bootstrap-check.sh, with no POSIX shell (measurement, not a gate)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = (cmd /c "hooks\bootstrap-check.sh" 2>&1 | Out-String)
          $code = $LASTEXITCODE
          if ($null -eq $code) {
            Write-Output "::error::the measurement did not complete -- no exit code was captured, so this cell established nothing"
            exit 1
          }
          $emitted = if ([string]::IsNullOrWhiteSpace($out)) { "NOTHING (silent)" } else { $out.Trim() }
          $summary = @"
          ### ``hooks/bootstrap-check.sh`` invoked through ``cmd.exe``

          Measured on ``windows-latest``, with no POSIX shell in the invocation path.

          | | |
          | --- | --- |
          | exit code | ``$code`` |
          | output | ``$emitted`` |

          Recorded rather than asserted: this cell exists to replace a guess that
          has been restated across three handoffs and measured none of them. It
          does not establish how Claude Code dispatches hook commands on Windows.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Output "exit=$code"
          Write-Output "output=$emitted"

  # THE DECLARED MSRV IS ONLY WORTH DECLARING IF SOMETHING CHECKS IT.
  # `rust-version` in Cargo.toml is a promise to consumers: cargo refuses to
  # build day on an older toolchain and says why. Nothing makes that promise
  # TRUE, though -- a dependency bump can raise the real floor above the
  # declared one, and the declaration keeps reading fine while being wrong.
  # That is this repo's recurring "a guarantee nothing can fail over" shape,
  # applied to the build: a Rust requirement fails the build when it is
  # missing, and a number in a manifest fails nothing.
  #
  # The floor here is transitive rather than day's own code -- `darling` 0.23.0,
  # via `schemars_derive` -- which is exactly the case that moves without anyone
  # editing day. `cargo update` is all it takes.
  #
  # THE VALUE IS READ FROM Cargo.toml RATHER THAN REPEATED HERE, so the job and
  # the manifest cannot drift. Bumping rust-version re-points this job with no
  # second edit -- a hardcoded version here would be a second source of truth
  # about one fact, which is the defect class this repo keeps recording.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the declared MSRV
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$v" ]; then
            echo "::error::Cargo.toml declares no rust-version, so this job has nothing to verify. Either add one or delete this job -- a job that silently checks nothing is worse than no job."
            exit 1
          fi
          echo "Declared MSRV: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # RUSTUP_TOOLCHAIN is a guard, not decoration. day ships no
      # rust-toolchain.toml today, so the toolchain installed above is what
      # runs -- but a `rust-toolchain.toml` pinning `stable` takes precedence
      # over an installed toolchain, and adding one is a one-file change nobody
      # would connect to this job. kan has exactly that file, and without this
      # line its equivalent job silently tested stable and passed regardless of
      # the declared MSRV. Setting it here costs nothing and means this job
      # cannot be disarmed by an unrelated commit.
      #
      # `check` rather than `test`: this verifies the crate COMPILES on the
      # declared floor, which is what rust-version promises. Runtime behaviour
      # is covered by the test job on stable -- and the test job needs a real
      # kan, zsh, and a tag-bearing checkout, none of which the floor is about.
      - name: Build on the declared MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          rustc --version
          cargo check --workspace --all-targets
