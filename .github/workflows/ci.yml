name: CI

on:
  push:
  pull_request:

env:
  # The kan the hermetic suite runs against. Pinned rather than tracking
  # kan's default branch: CI must fail because *day* changed, and an unpinned
  # dependency turns an unrelated kan commit into a red build here.
  #
  # `.github/workflows/kan-compat.yml` is what covers the *other* versions —
  # this pin is the one pairing every push checks.
  KAN_TAG: v0.9.1-beta.1

jobs:
  behaviour-diff:
    name: behaviour-diff (dedicated, serialized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # This target recursively builds HEAD and a worktree. Keeping it out of
      # the ordinary Cargo scheduler prevents nested builds from contending
      # with sibling test targets; one thread also serializes its own fixtures.
      - name: Run every behaviour-diff integrity check
        run: cargo test --test behaviour_diff -- --ignored --test-threads=1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, not just the tip. `every_released_tag_has_a_migration_expectation`
          # asserts the expectation file has a row for every released tag, and a
          # shallow checkout fetches no tags at all — over an empty set that
          # check is vacuously true. It reports could-not-check rather than
          # passing, which turns a silent hole into a red build; this is what
          # keeps it from being red for the wrong reason.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Without this, `tests/kan_conformance.rs` SKIPS — it resolves `kan`
      # through PATH and skips when absent, per CLAUDE.md's rule that no test
      # may require a real kan install. That rule is right, and its
      # consequence was that day's only check against kan's *actual* contract
      # never ran in CI at all. Every other test stubs kan through
      # DAY_KAN_BIN, which validates day against day's own idea of kan's CLI —
      # the blind spot that shipped a documented `kan result` invocation that
      # does not run, through several releases (day#27, kan#78).
      #
      # kan is not published to crates.io, so this installs from the tag.
      - name: Cache the kan binary
        id: kan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/kan
          key: kan-${{ env.KAN_TAG }}-${{ runner.os }}

      - name: Install kan
        if: steps.kan-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/kan-tools/kan \
            --tag "${KAN_TAG}" kan

      - name: Confirm the conformance suite can actually see kan
        run: |
          # A silent skip is the failure mode this whole block exists to end,
          # so assert kan is present rather than trusting the install step's
          # exit code.
          kan --version
          test -x "$(command -v kan)"

      - name: Confirm the pinned kan can run the trust-withholding cell
        run: |
          # tests/kan_conformance.rs's day#120 cell skips, correctly, when the
          # kan it meets has no `identity role add` — a local run against an
          # arbitrary kan must not fail over a feature that kan never had. But
          # on THIS job the kan is pinned, so the skip firing here would mean
          # the newest read-contract behaviour day depends on is tested
          # nowhere on push — a silent skip wearing a different hat, guarded
          # for the same reason the `kan --version` assertion above exists.
          # v0.9.1-beta.1 has roles (they landed in kan v0.8); if a future pin
          # predates them, this says so instead of the cell quietly skipping.
          # `--help` is the probe because it proves the verb exists without
          # executing a write: measured, it exits 0 where the verb exists and
          # 2 where it does not, and it cannot hang on an identity store.
          kan identity role add --help >/dev/null \
            || { echo "the pinned kan ${KAN_TAG} has no 'identity role add'; the day#120 conformance cell would silently skip on every push"; exit 1; }

      # Same reason the kan install above exists, and the same failure it
      # prevents. `tests/documented_invocations.rs` runs day's documented
      # examples through zsh where it is available and `sh` otherwise — and the
      # defect it exists for, day#83's unquoted glob, PASSES under `sh`. Without
      # zsh here, the one criterion that reproduces day#83 would be a permanent
      # could-not-check, which is a silent skip wearing a different hat.
      - name: Install zsh, so the docs corpus runs in the shell the bug is in
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          zsh -c 'exit 0'

      - name: Validate RFC and ADR structure
        run: |
          scripts/check-rfcs-adrs.sh
          scripts/check-rfcs-adrs.sh --self-test

      - run: cargo build --workspace --all-targets
      # `--no-fail-fast` IS LOAD-BEARING, NOT TIDINESS. `cargo test` aborts the
      # whole run at the first failing TARGET, and a bare `cargo test
      # --workspace` therefore reports on a prefix of the suite whose length
      # depends on which target failed and where it sorts alphabetically.
      #
      # Measured on `main` at 9f66fee (day#178): `tests/behaviour_diff.rs`
      # failed, and **7 of 30 targets ran**. The other 23 -- `plugin.rs`,
      # `kan_conformance.rs`, `documented_invocations.rs`, `harness_honesty.rs`
      # and the rest -- never executed, and `main` had been in that state since
      # at least the previous merge. The red tick said "something failed"; it
      # could not say "23 targets produced no result", and nothing but counting
      # `Running` lines in the log would reveal it.
      #
      # That is this repo's own rule -- could-not-check outranks
      # checked-and-clean -- broken at the RUNNER rather than inside a test. A
      # suite that stops early does not report a smaller failure, it reports an
      # unknown one.
      #
      # It does not weaken the gate. Measured by injecting a panic into an
      # early-sorting target: with fail-fast, 4 targets ran; with
      # `--no-fail-fast`, 30 ran; **both exited 101**. The build still fails, it
      # just fails having actually looked.
      - run: cargo test --workspace --no-fail-fast
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

  # Windows proves day's binary and harness-neutral Agent Plugins payload stay
  # portable. Installation guidance is content in skills/install/SKILL.md, not
  # an executable hook with an undeclared shell or Node dependency.
  #
  # WHAT IT CANNOT CHECK, named rather than silently omitted, because
  # could-not-check outranks checked-and-clean:
  #
  #   The integration suite does not run here and cannot. Seventeen files under
  #   `tests/` call `std::os::unix::fs::symlink`, including `tests/common/mod.rs`,
  #   which every integration target imports -- so they do not fail on Windows,
  #   they fail to COMPILE. `cargo test --lib` is therefore what runs: the 185
  #   unit tests, which live in `src/` and carry no `std::os::unix` at all.
  #   Making the integration suite portable is a separate piece of work, and
  #   pretending this job covers it by running a command that cannot build would
  #   be the could-not-check-reported-as-clean failure one level up.
  #
  #   `.claude/skills/` is six symlinks (mode 120000). A Windows checkout
  #   without `core.symlinks` turns them into text files holding their target
  #   path, so the local-reachability wiring is a known open question on Windows
  #   -- and it is `every_shipped_command_is_reachable_in_this_repo` that would
  #   answer it, which is in the suite that cannot compile. Stated so the gap is
  #   visible rather than inferred from a green tick.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # day's own code is portable -- `src/` carries no `std::os::unix`, no
      # `cfg(unix)` and no `cfg(target_os)`. This asserts that stays true.
      - name: Build on Windows
        run: cargo build --workspace

      - name: Unit tests (see the note above for what this deliberately excludes)
        run: cargo test --lib

      # THE PACKAGING-CONFORMANCE SUITE RUNS HERE TOO, and it is the one
      # integration target that can. `tests/agent_plugins.rs` deliberately does
      # not `mod common;` — that module calls `std::os::unix::fs::symlink`, and
      # importing it for one `repo_root()` one-liner would have made the
      # conformance suite for a CROSS-HARNESS PORTABILITY milestone the thing
      # excluded from the only cross-platform job. Four lines bought this.
      - name: Agent Plugins conformance suite
        run: cargo test --test agent_plugins

  # THE DECLARED MSRV IS ONLY WORTH DECLARING IF SOMETHING CHECKS IT.
  # `rust-version` in Cargo.toml is a promise to consumers: cargo refuses to
  # build day on an older toolchain and says why. Nothing makes that promise
  # TRUE, though -- a dependency bump can raise the real floor above the
  # declared one, and the declaration keeps reading fine while being wrong.
  # That is this repo's recurring "a guarantee nothing can fail over" shape,
  # applied to the build: a Rust requirement fails the build when it is
  # missing, and a number in a manifest fails nothing.
  #
  # The floor here is transitive rather than day's own code -- `darling` 0.23.0,
  # via `schemars_derive` -- which is exactly the case that moves without anyone
  # editing day. `cargo update` is all it takes.
  #
  # THE VALUE IS READ FROM Cargo.toml RATHER THAN REPEATED HERE, so the job and
  # the manifest cannot drift. Bumping rust-version re-points this job with no
  # second edit -- a hardcoded version here would be a second source of truth
  # about one fact, which is the defect class this repo keeps recording.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the declared MSRV
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$v" ]; then
            echo "::error::Cargo.toml declares no rust-version, so this job has nothing to verify. Either add one or delete this job -- a job that silently checks nothing is worse than no job."
            exit 1
          fi
          echo "Declared MSRV: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # RUSTUP_TOOLCHAIN is a guard, not decoration. day ships no
      # rust-toolchain.toml today, so the toolchain installed above is what
      # runs -- but a `rust-toolchain.toml` pinning `stable` takes precedence
      # over an installed toolchain, and adding one is a one-file change nobody
      # would connect to this job. kan has exactly that file, and without this
      # line its equivalent job silently tested stable and passed regardless of
      # the declared MSRV. Setting it here costs nothing and means this job
      # cannot be disarmed by an unrelated commit.
      #
      # `check` rather than `test`: this verifies the crate COMPILES on the
      # declared floor, which is what rust-version promises. Runtime behaviour
      # is covered by the test job on stable -- and the test job needs a real
      # kan, zsh, and a tag-bearing checkout, none of which the floor is about.
      - name: Build on the declared MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          rustc --version
          cargo check --workspace --all-targets
