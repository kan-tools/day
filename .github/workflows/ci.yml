name: CI

on:
  push:
  pull_request:

env:
  # The kan the hermetic suite runs against. Pinned rather than tracking
  # kan's default branch: CI must fail because *day* changed, and an unpinned
  # dependency turns an unrelated kan commit into a red build here.
  #
  # `.github/workflows/kan-compat.yml` is what covers the *other* versions —
  # this pin is the one pairing every push checks.
  KAN_TAG: v0.9.1-beta.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, not just the tip. `every_released_tag_has_a_migration_expectation`
          # asserts the expectation file has a row for every released tag, and a
          # shallow checkout fetches no tags at all — over an empty set that
          # check is vacuously true. It reports could-not-check rather than
          # passing, which turns a silent hole into a red build; this is what
          # keeps it from being red for the wrong reason.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Without this, `tests/kan_conformance.rs` SKIPS — it resolves `kan`
      # through PATH and skips when absent, per CLAUDE.md's rule that no test
      # may require a real kan install. That rule is right, and its
      # consequence was that day's only check against kan's *actual* contract
      # never ran in CI at all. Every other test stubs kan through
      # DAY_KAN_BIN, which validates day against day's own idea of kan's CLI —
      # the blind spot that shipped a documented `kan result` invocation that
      # does not run, through several releases (day#27, kan#78).
      #
      # kan is not published to crates.io, so this installs from the tag.
      - name: Cache the kan binary
        id: kan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/kan
          key: kan-${{ env.KAN_TAG }}-${{ runner.os }}

      - name: Install kan
        if: steps.kan-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/kan-tools/kan \
            --tag "${KAN_TAG}" kan

      - name: Confirm the conformance suite can actually see kan
        run: |
          # A silent skip is the failure mode this whole block exists to end,
          # so assert kan is present rather than trusting the install step's
          # exit code.
          kan --version
          test -x "$(command -v kan)"

      # Same reason the kan install above exists, and the same failure it
      # prevents. `tests/documented_invocations.rs` runs day's documented
      # examples through zsh where it is available and `sh` otherwise — and the
      # defect it exists for, day#83's unquoted glob, PASSES under `sh`. Without
      # zsh here, the one criterion that reproduces day#83 would be a permanent
      # could-not-check, which is a silent skip wearing a different hat.
      - name: Install zsh, so the docs corpus runs in the shell the bug is in
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          zsh -c 'exit 0'

      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

  # THE DECLARED MSRV IS ONLY WORTH DECLARING IF SOMETHING CHECKS IT.
  # `rust-version` in Cargo.toml is a promise to consumers: cargo refuses to
  # build day on an older toolchain and says why. Nothing makes that promise
  # TRUE, though -- a dependency bump can raise the real floor above the
  # declared one, and the declaration keeps reading fine while being wrong.
  # That is this repo's recurring "a guarantee nothing can fail over" shape,
  # applied to the build: a Rust requirement fails the build when it is
  # missing, and a number in a manifest fails nothing.
  #
  # The floor here is transitive rather than day's own code -- `darling` 0.23.0,
  # via `schemars_derive` -- which is exactly the case that moves without anyone
  # editing day. `cargo update` is all it takes.
  #
  # THE VALUE IS READ FROM Cargo.toml RATHER THAN REPEATED HERE, so the job and
  # the manifest cannot drift. Bumping rust-version re-points this job with no
  # second edit -- a hardcoded version here would be a second source of truth
  # about one fact, which is the defect class this repo keeps recording.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the declared MSRV
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$v" ]; then
            echo "::error::Cargo.toml declares no rust-version, so this job has nothing to verify. Either add one or delete this job -- a job that silently checks nothing is worse than no job."
            exit 1
          fi
          echo "Declared MSRV: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # RUSTUP_TOOLCHAIN is a guard, not decoration. day ships no
      # rust-toolchain.toml today, so the toolchain installed above is what
      # runs -- but a `rust-toolchain.toml` pinning `stable` takes precedence
      # over an installed toolchain, and adding one is a one-file change nobody
      # would connect to this job. kan has exactly that file, and without this
      # line its equivalent job silently tested stable and passed regardless of
      # the declared MSRV. Setting it here costs nothing and means this job
      # cannot be disarmed by an unrelated commit.
      #
      # `check` rather than `test`: this verifies the crate COMPILES on the
      # declared floor, which is what rust-version promises. Runtime behaviour
      # is covered by the test job on stable -- and the test job needs a real
      # kan, zsh, and a tag-bearing checkout, none of which the floor is about.
      - name: Build on the declared MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          rustc --version
          cargo check --workspace --all-targets
