name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  # Release reruns the same RFC/publication tests as CI, so it needs the same
  # read-only GitHub authority and the same pinned kan reader.
  GH_TOKEN: ${{ github.token }}
  KAN_TAG: v0.13.0-beta.1

jobs:
  publish:
    runs-on: ubuntu-latest
    # Scopes CARGO_REGISTRY_TOKEN to this job (not repo-wide) and enforces
    # the environment's deployment-tag policy (v*.*.* only) as a second,
    # independently-configured guard beyond this workflow's own trigger
    # filter above. Same setup kan uses; required-reviewer approval isn't
    # available on kan-tools' current GitHub plan, so the tag policy is the
    # gate.
    environment: crates-io
    # `contents: write` is what lets `gh release create` below run. Declared on
    # the job rather than relying on the repository's default token permissions,
    # which are a setting somebody can change without touching this file — and a
    # release step that silently loses its permission would fail at the last
    # step of a publish, after the crate is already on crates.io.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and every branch ref, for the same reason `ci.yml` gives:
          # a test in the suite this job re-runs needs them.
          #
          # `every_commit_is_accounted_for_under_the_demonstration_rule` asks the
          # commit census what is unaccounted between `main` and HEAD. At a TAG
          # checkout with the default fetch depth there is no `main` and no
          # `origin/main`, so the census correctly reports COULD-NOT-CHECK and
          # the test correctly refuses to call that a pass — and the release does
          # not publish. That is the census being right and the environment being
          # wrong.
          #
          # Found by v0.11.0-beta.1's own release failing to publish. It is the
          # FIFTH context in this milestone where a check met a mode this repo is
          # never in, and the third distinct CI context where this particular
          # base resolution had to be taught one (PR head, push to main, tag).
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cache the kan binary used by release tests
        id: kan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/kan
          key: kan-${{ env.KAN_TAG }}-${{ runner.os }}

      - name: Install kan used by release tests
        if: steps.kan-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/kan-tools/kan \
            --tag "${KAN_TAG}" --force kan

      - name: Confirm release tests can resolve kan
        run: |
          kan --version
          test -x "$(command -v kan)"

      # Re-verify before publishing rather than trusting a separate CI run
      # (the tag push also triggers ci.yml, but a publish workflow should be
      # self-contained, not depend on cross-workflow status).
      - run: cargo build --workspace --all-targets
      # `--no-fail-fast` IS LOAD-BEARING, NOT TIDINESS. `cargo test` aborts the
      # whole run at the first failing TARGET, and a bare `cargo test
      # --workspace` therefore reports on a prefix of the suite whose length
      # depends on which target failed and where it sorts alphabetically.
      #
      # Measured on `main` at 9f66fee (day#178): `tests/behaviour_diff.rs`
      # failed, and **7 of 30 targets ran**. The other 23 -- `plugin.rs`,
      # `kan_conformance.rs`, `documented_invocations.rs`, `harness_honesty.rs`
      # and the rest -- never executed, and `main` had been in that state since
      # at least the previous merge. The red tick said "something failed"; it
      # could not say "23 targets produced no result", and nothing but counting
      # `Running` lines in the log would reveal it.
      #
      # That is this repo's own rule -- could-not-check outranks
      # checked-and-clean -- broken at the RUNNER rather than inside a test. A
      # suite that stops early does not report a smaller failure, it reports an
      # unknown one.
      #
      # It does not weaken the gate. Measured by injecting a panic into an
      # early-sorting target: with fail-fast, 4 targets ran; with
      # `--no-fail-fast`, 30 ran; **both exited 101**. The build still fails, it
      # just fails having actually looked.
      - run: cargo test --workspace --no-fail-fast
      - name: Run every behaviour-diff integrity check serially
        run: cargo test --test behaviour_diff -- --ignored --test-threads=1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

      - name: Verify tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (version $tag_version) does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      - run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      # THE GITHUB RELEASE IS PART OF PUBLISHING, NOT A STEP BESIDE IT.
      #
      # `v0.12.0-beta.2` shipped to crates.io and had no GitHub Release for a
      # day. The other seventeen were backfilled by hand in one batch, so the
      # gap was invisible until somebody enumerated tags against releases —
      # which is `scripts/cut-release.sh`'s own lesson arriving one step later:
      # "what was mechanized got done; what was ritual got dropped". A reminder
      # here would be the ritual. The tag push already publishes the crate, so
      # the release is created by the same event and cannot be forgotten
      # separately.
      #
      # Notes come from `CHANGELOG.md`, whose section for this tag is
      # guaranteed to exist by `every_released_tag_has_a_changelog_section` —
      # so this reads a file another check keeps honest rather than
      # reconstructing prose at release time.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"

          # Idempotent: a re-run of this workflow must not fail because the
          # release it already created exists. Nothing here edits an existing
          # release — re-running is for recovering a failed publish, and
          # silently rewriting published notes is not recovery.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; leaving it alone"
            exit 0
          fi

          # This tag's section: from its heading to the next `## ` heading, or
          # to the link-definition block, whichever comes first. The OLDEST
          # release has no following heading, so without the second stop
          # condition it swallows all 79 definitions as body text.
          awk -v tag="$tag" '
            index($0, "## [" tag "]") == 1 { found = 1; next }
            found && (index($0, "## ") == 1 || $0 ~ /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > section.md

          # **Checked on the SECTION, before the definitions are appended.**
          # Appending first and checking after would be a guard that can never
          # fire: the definition block is 79 non-blank lines, so the file is
          # non-empty for every tag including one with no section at all. That
          # is this repo's own "check that cannot fail" defect, in the check
          # written to stop a release that says nothing.
          if ! grep -q '[^[:space:]]' section.md; then
            echo "::error::no CHANGELOG.md section found for $tag, so there are no notes to publish. every_released_tag_has_a_changelog_section should have caught this before the tag was cut."
            exit 1
          fi

          # Release notes are standalone markdown — they do not inherit
          # CHANGELOG.md's reference definitions. Append only definitions the
          # section actually uses: carrying the entire changelog's reference
          # catalog makes the API body noisy and obscures the user-facing notes.
          cp section.md notes.md
          printf '\n' >> notes.md
          grep -o '\[[^]]*\]' section.md | sort -u | while IFS= read -r ref; do
            grep -F "${ref}: " CHANGELOG.md || true
          done >> notes.md

          # Every release so far is a prerelease, and that is a property of the
          # version rather than a policy: a tag carrying a `-` is pre-1.0 by
          # SemVer. Hardcoding `--prerelease` would silently mislabel the first
          # stable release.
          case "$tag" in
            *-*) prerelease="--prerelease" ;;
            *)   prerelease="" ;;
          esac

          # shellcheck disable=SC2086
          gh release create "$tag" --title "$tag" --notes-file notes.md $prerelease
