[package]
name = "day"
version = "0.12.0-beta.4"
edition = "2021"
# Measured, not inferred: CI's `msrv` job reads this value and builds with
# exactly it, so the declaration cannot drift from the truth. The floor is set
# by `darling` 0.23.0 -- reached transitively through `schemars_derive` -- which
# declares `rust-version = "1.88"`, so cargo refuses to build 1.87 and below.
# 1.85, 1.86 and 1.87 were each measured red; 1.88 clean. Bumping this line
# re-points the CI job automatically; there is nothing else to update.
rust-version = "1.88"
authors = ["Maxine Levesque"]
license = "MIT"
description = "Structured process layer for AI-assisted development — teloi, atoms, and drift, recorded in kan."
repository = "https://github.com/kan-tools/day"
homepage = "https://github.com/kan-tools/day"
documentation = "https://docs.rs/day"
readme = "README.md"
keywords = ["agents", "process", "teloi", "workflow", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
rmcp = { version = "2.2.0", features = ["transport-io"] }
schemars = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.4", features = ["process", "io-util", "time"] }
